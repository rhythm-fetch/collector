# Temporary (Hiyabye/Rhythm#218): measures scheduled-run drift for about a week.
# Each run does nothing; the delay is read later from the run's created and
# started times against its 15-minute slot. Remove when the gate is recorded.
name: Drift probe

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: date -u +%Y-%m-%dT%H:%M:%SZ
